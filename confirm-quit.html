<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quit AEGIS</title>
<style>
:root {
  --bg-card: #0f101d;
  --border: rgba(255, 255, 255, 0.1);
  --border-hover: rgba(255, 255, 255, 0.2);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-sub: #64748b;
  --red-from: #ef4444;
  --red-to: #dc2626;
  --red-glow: rgba(239, 68, 68, 0.35);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

html, body {
  height: 100%;
  width: 100%;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--text-main);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

/* Top accent animated gradient line */
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, #ef4444, #f59e0b, #ef4444);
  background-size: 200% 100%;
  animation: shimmer 3.5s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-badge {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.1));
  border: 1px solid rgba(239, 68, 68, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f87171;
  flex-shrink: 0;
}

.header-text {
  flex: 1;
}

.title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.2px;
  color: #ffffff;
}

.subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 1px;
}

.close-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s var(--ease);
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  border-color: rgba(255, 255, 255, 0.14);
}

/* Content */
.content {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-muted);
  margin: 12px 0 16px;
}

/* Button actions */
.btn-group {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s var(--ease);
  outline: none;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text-main);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

.btn-danger {
  background: linear-gradient(135deg, var(--red-from), var(--red-to));
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ffffff;
}

.btn-danger:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
}

.btn:active {
  transform: translateY(0);
}

.btn-danger:focus, .btn-secondary:focus {
  border-color: rgba(255, 255, 255, 0.35);
}

/* Keyboard badge */
.kbd {
  display: inline-block;
  padding: 1px 4px;
  font-size: 9px;
  font-weight: 600;
  font-family: inherit;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 3px;
  opacity: 0.85;
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="icon-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="header-text">
      <div class="title">Quit AEGIS</div>
      <div class="subtitle">Confirmation required</div>
    </div>
    <button class="close-btn" id="close-btn" title="Cancel (Esc)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="content">
    Are you sure you want to close AEGIS? All open tabs and workspaces will be safely saved.
  </div>

  <div class="btn-group">
    <button class="btn btn-secondary" id="cancel-btn">
      Cancel <span class="kbd">Esc</span>
    </button>
    <button class="btn btn-danger" id="quit-btn" autofocus>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Quit AEGIS <span class="kbd">↵</span>
    </button>
  </div>
</div>

<script>
const g = window.ghost;

function quit() {
  if (g && g.confirmQuitAction) {
    g.confirmQuitAction('quit');
  }
}

function cancel() {
  if (g && g.confirmQuitAction) {
    g.confirmQuitAction('cancel');
  }
}

document.getElementById('quit-btn').onclick = quit;
document.getElementById('cancel-btn').onclick = cancel;
document.getElementById('close-btn').onclick = cancel;

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    cancel();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    quit();
  }
});
</script>

</body>
</html>
