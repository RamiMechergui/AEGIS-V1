<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#141432 0%,#1a1a2e 50%,#16213e 100%);color:#e2e8f0;overflow:hidden}

.scroll{height:100%;overflow-y:auto;padding:32px 24px 24px}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px}

.header{text-align:center;margin-bottom:28px}
.header h1{font-size:22px;font-weight:300;letter-spacing:2px;color:#e2e8f0}
.header p{font-size:12px;color:#68d391;margin-top:4px}
.close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid #1a365d;color:#a0aec0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:5}
.close-btn:hover{background:#e53e3e;border-color:#e53e3e;color:#fff}

.card{background:rgba(15,52,96,0.35);border:1px solid #1a365d;border-radius:14px;padding:24px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:#2a4a7a}
.card-title{font-size:14px;font-weight:500;color:#e2e8f0;margin-bottom:2px}
.card-desc{font-size:11px;color:#718096;margin-bottom:16px}

/* Toggle switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.toggle-l{font-size:13px;color:#e2e8f0}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#0a2950;border:1px solid #1a365d;border-radius:26px;transition:all .2s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#718096;border-radius:50%;transition:all .2s}
input:checked + .slider{background:linear-gradient(135deg,#4299e1,#3182ce);border-color:#3182ce}
input:checked + .slider:before{transform:translateX(20px);background:#fff}

.st-input{width:100%;padding:11px 14px;background:#0a2950;border:1px solid #1a365d;border-radius:8px;color:#e2e8f0;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.st-input:focus{border-color:#4299e1;box-shadow:0 0 0 3px rgba(66,153,225,0.12)}
.select-wrap{display:flex;align-items:center;gap:10px;margin-top:14px}
.select-wrap select{flex:1}
.select-wrap .unit{font-size:12px;color:#718096}
.disabled-zone{opacity:0.4;pointer-events:none}

.btn{padding:10px 24px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px;width:100%;justify-content:center}
.btn-primary{background:linear-gradient(135deg,#4299e1,#3182ce);color:#fff}
.btn-primary:hover{box-shadow:0 4px 14px rgba(66,153,225,0.35);transform:translateY(-1px)}
.msg{font-size:11px;margin-top:8px;min-height:16px;text-align:center}
.msg-ok{color:#68d391}
.msg-err{color:#fc8181}

.status-dot{width:6px;height:6px;border-radius:50%;background:#68d391;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.footer{text-align:center;padding:16px 0 8px;font-size:10px;color:#2d3748}
</style>
</head>
<body>
<div class="scroll">
  <button class="close-btn" id="close-btn">&#x2715;</button>

  <div class="header">
    <h1>Parameters</h1>
    <p><span class="status-dot"></span>Ghost Mode Active</p>
  </div>

  <!-- Automatic Close / Idle -->
  <div class="card">
    <div class="card-title">Automatic Close</div>
    <div class="card-desc">Automatically close AEGIS and return to the Login Menu after a period of inactivity.</div>

    <div class="toggle-row">
      <span class="toggle-l">Enable automatic close</span>
      <label class="switch">
        <input type="checkbox" id="ac-enabled">
        <span class="slider"></span>
      </label>
    </div>

    <div id="ac-timer-zone">
      <div class="select-wrap" id="ac-select-wrap">
        <select class="st-input select" id="ac-minutes">
          <option value="1">1 minute</option>
          <option value="2">2 minutes</option>
          <option value="5" selected>5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">60 minutes</option>
        </select>
        <span class="unit">of inactivity</span>
      </div>
    </div>

    <button class="btn btn-primary" id="ac-save">Save Parameters</button>
    <div id="ac-msg" class="msg"></div>
  </div>

  <div class="footer">AEGIS v1.0 &mdash; Zero tracking. Zero cache.</div>
</div>

<script>
const g = window.ghost;

document.getElementById('close-btn').onclick = () => window.close();

const enabledEl = document.getElementById('ac-enabled');
const timerZone = document.getElementById('ac-timer-zone');
const minutesEl = document.getElementById('ac-minutes');
const saveBtn = document.getElementById('ac-save');
const msgEl = document.getElementById('ac-msg');

function syncDisabled() {
  timerZone.classList.toggle('disabled-zone', !enabledEl.checked);
}

enabledEl.onchange = syncDisabled;

async function load() {
  const s = await g.getAutoClose();
  enabledEl.checked = !!s.enabled;
  const mins = Math.round((s.seconds || 300) / 60);
  if (mins > 0 && [...minutesEl.options].some(o => Number(o.value) === mins)) minutesEl.value = String(mins);
  syncDisabled();
}

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  const r = await g.setAutoClose(enabledEl.checked, Number(minutesEl.value));
  saveBtn.disabled = false;
  if (r.ok) { msgEl.textContent = 'Parameters saved!'; msgEl.className = 'msg msg-ok'; }
  else { msgEl.textContent = r.error || 'Failed to save.'; msgEl.className = 'msg msg-err'; }
};

load();
</script>
</body>
</html>
