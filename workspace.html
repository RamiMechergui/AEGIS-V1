<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AEGIS — Workspaces</title>
<style>
:root {
  --bg: #06060f;
  --surface: #0c0c1a;
  --surface2: #111122;
  --surface3: #18182a;
  --border: rgba(255,255,255,0.04);
  --border2: rgba(255,255,255,0.08);
  --border3: rgba(255,255,255,0.12);
  --text: #e2e2f0;
  --text2: #8080a0;
  --text3: #50506a;
  --blue: #4a8bc5;
  --blue-hover: #5b9bd8;
  --blue-bg: rgba(74,139,197,0.1);
  --green: #48bb78;
  --green-bg: rgba(72,187,120,0.1);
  --red: #e56a6a;
  --red-bg: rgba(229,106,106,0.08);
  --radius: 14px;
  --ease: cubic-bezier(0.4,0,0.2,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;font-size:13px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Background ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.08;animation:drift 14s ease-in-out infinite}
.orb1{width:500px;height:500px;background:#4a8bc5;top:-150px;right:-100px;animation-delay:0s}
.orb2{width:400px;height:400px;background:#7a5db5;bottom:-100px;left:-80px;animation-delay:-5s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.02;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:128px 128px}

/* ── Layout ── */
.shell{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:0 28px 0}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:12px}
.logo-sm{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,rgba(74,139,197,0.2),rgba(122,93,181,0.2));
  border:1px solid rgba(74,139,197,0.2);display:flex;align-items:center;justify-content:center}
.hdr-title h2{font-size:16px;font-weight:500;letter-spacing:-0.2px}
.hdr-title .sub{font-size:10.5px;color:var(--text3);margin-top:1px}
.hdr-title .sub .nm{color:var(--blue);font-weight:500}
.hdr-actions{display:flex;gap:8px;align-items:center}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 14px;
  border-radius:9px;cursor:pointer;font-size:10.5px;font-family:inherit;font-weight:400;
  transition:all .15s var(--ease);display:flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--red-bg);border-color:rgba(229,106,106,0.2);color:var(--red)}
.btn-ghost svg{width:12px;height:12px}
.btn-new{background:var(--blue);border:none;color:#fff;padding:8px 18px;
  border-radius:9px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:500;
  transition:all .2s var(--ease);display:flex;align-items:center;gap:7px;
  box-shadow:0 4px 16px rgba(74,139,197,0.25)}
.btn-new:hover{background:var(--blue-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(74,139,197,0.35)}
.btn-new:active{transform:translateY(0)}
.btn-new svg{width:12px;height:12px}

/* ── Search ── */
.search-wrap{padding:14px 0 0;flex-shrink:0}
.search-inner{position:relative;display:flex;align-items:center}
.search-inner svg{position:absolute;left:12px;width:14px;height:14px;color:var(--text3);pointer-events:none}
#ws-search{width:320px;padding:9px 12px 9px 36px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;
  transition:all .2s var(--ease)}
#ws-search:focus{border-color:var(--blue);background:var(--surface2);box-shadow:0 0 0 3px rgba(74,139,197,0.12)}
#ws-search::placeholder{color:var(--text3)}

/* ── Grid ── */
.grid-wrap{flex:1;overflow-y:auto;padding:16px 0 24px}
#gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* ── Workspace Card ── */
.wc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;
  animation:cardIn .3s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wc-top{height:5px;background:var(--ws-color,var(--blue));opacity:0.85;flex-shrink:0}
.wc-body{padding:18px 18px 14px}
.wc:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(255,255,255,0.06),0 12px 40px rgba(0,0,0,0.4)}
.wc:hover .wc-top{opacity:1}
.wc-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.wc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .3s var(--ease-spring);}
.wc:hover .wc-icon{transform:scale(1.08) rotate(-4deg)}
.wc-meta{flex:1;min-width:0}
.wc-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-date{font-size:9.5px;color:var(--text3);margin-top:2px}
.wc-del{background:none;border:none;color:var(--text3);cursor:pointer;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0;opacity:0;
  transition:all .15s var(--ease)}
.wc:hover .wc-del{opacity:0.5}
.wc-del:hover{opacity:1!important;color:var(--red);background:var(--red-bg)}
.wc-del svg{width:10px;height:10px}
.wc-rename{background:none;border:none;color:var(--text3);cursor:pointer;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0;opacity:0;
  transition:all .15s var(--ease)}
.wc:hover .wc-rename{opacity:0.5}
.wc-rename:hover{opacity:1!important;color:var(--blue);background:var(--blue-bg)}
.wc-rename svg{width:11px;height:11px}
.wc-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wc-stat{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.wc-stat svg{width:11px;height:11px;color:var(--text3)}
.wc-stat .dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;
  animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.35}}
.wc-open{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:500;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
  color:var(--ws-color,var(--blue));opacity:0;transition:all .2s var(--ease);transform:translateX(-4px)}
.wc:hover .wc-open{opacity:1;transform:none}
.wc-open svg{width:10px;height:10px}
.playing-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--green)}
.playing-badge svg{width:10px;height:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Empty ── */
.he{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;
  color:var(--text3);gap:8px;grid-column:1/-1}
.he svg{opacity:0.15;width:40px;height:40px}
.he .bt{font-size:13px;color:var(--text2);margin-top:4px}
.he .bs{font-size:10.5px}

/* ── Now Playing ── */
#np{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;display:none;
  align-items:center;gap:6px;background:var(--green-bg);border:1px solid rgba(72,187,120,0.15);
  border-radius:999px;padding:8px 18px;font-size:10.5px;color:var(--green);
  cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:all .2s var(--ease);
  max-width:calc(100vw - 48px);overflow:hidden}
#np:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
#np-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Modal ── */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
  align-items:center;justify-content:center}
.modal.open{display:flex;animation:fadeIn .15s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:28px;
  width:360px;box-shadow:0 16px 64px rgba(0,0,0,0.6);animation:slideUp .2s var(--ease)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mbox h3{font-size:15px;font-weight:500;margin-bottom:3px}
.mbox p{font-size:10.5px;color:var(--text2);margin-bottom:20px;line-height:1.45}
.mbox input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;
  font-family:inherit;outline:none;margin-bottom:10px;transition:all .2s}
.mbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,139,197,0.12)}
.mbox .merr{font-size:10px;color:var(--red);min-height:14px;margin-bottom:10px}
.mb{display:flex;gap:8px}
.mb button{flex:1;padding:9px;border:none;border-radius:9px;font-size:11.5px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .15s}
.mb .mp{background:var(--blue);color:#fff}
.mb .mp:hover{background:var(--blue-hover);transform:translateY(-1px)}
.mb .ms{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.mb .ms:hover{background:var(--surface3);color:var(--text)}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>

<div class="shell">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="logo-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b9bd8" stroke-width="1.5" stroke-linecap="round" style="width:18px;height:18px">
          <path d="M12 3a7 7 0 0 0-7 7c0 3.5 2 6.5 4 8.5a5 5 0 0 0 6 0c2-2 4-5 4-8.5a7 7 0 0 0-7-7z"/>
          <circle cx="9" cy="10" r="1" fill="#5b9bd8" stroke="none"/>
          <circle cx="15" cy="10" r="1" fill="#5b9bd8" stroke="none"/>
          <path d="M9 14c.5.5 1.5 1 3 1s2.5-.5 3-1" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="hdr-title">
        <h2>AEGIS Workspaces</h2>
        <div class="sub">Welcome back, <span class="nm" id="uname">—</span> · Choose a workspace to continue</div>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="btn-ghost" id="lgo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3l4 4-4 4M14 7H6M6 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3"/></svg>
        Logout
      </button>
      <button class="btn-new" id="nw">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        New Workspace
      </button>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-inner">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4"/><path d="M11 11l3 3"/></svg>
      <input id="ws-search" type="text" placeholder="Search workspaces…" autocomplete="off">
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <div id="gl"></div>
  </div>
</div>

<!-- Now Playing -->
<div id="np" title="Background media playing">
  <svg viewBox="0 0 16 16" fill="currentColor" style="width:12px;height:12px;animation:pulse 1.5s ease-in-out infinite"><path d="M5 2v9.3A3 3 0 1 0 7 13V5.5l5-1v3.8A3 3 0 1 0 14 9V1z"/></svg>
  <span id="np-title"></span>
</div>

<!-- Create Workspace Modal -->
<div class="modal" id="nm">
  <div class="mbox">
    <h3>Create Workspace</h3>
    <p>Each workspace has its own isolated browsing data — cookies, history, downloads and sessions are kept completely separate.</p>
    <input type="text" id="wni" placeholder="e.g. Work, Studies, Personal" maxlength="30">
    <div class="merr" id="wmerr"></div>
    <div class="mb">
      <button class="ms" id="wmc">Cancel</button>
      <button class="mp" id="wmok">Create Workspace</button>
    </div>
  </div>
</div>

<!-- Rename Workspace Modal -->
<div class="modal" id="rm">
  <div class="mbox">
    <h3>Rename Workspace</h3>
    <p>Choose a new name for this workspace.</p>
    <input type="text" id="rni" placeholder="Workspace name" maxlength="30">
    <div class="merr" id="rmerr"></div>
    <div class="mb">
      <button class="ms" id="rmc">Cancel</button>
      <button class="mp" id="rmok">Save</button>
    </div>
  </div>
</div>

<script>
const g = window.ghost;
const gl = document.getElementById('gl');

function esc(s) { const _e = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; return String(s==null?'':s).replace(/[&<>"']/g, c => _e[c]); }
function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
  return new Date(ts).toLocaleDateString([], { month:'short', day:'numeric' });
}

const icons = [
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="4" width="16" height="11" rx="2"/><path d="M7 15v1h6v-1M8 10l2 2 2-2M10 12V7"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 17V5h7l3 3v9H4z"/><path d="M11 5v3h3"/><path d="M7 10h6M7 13h4"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 2a12 12 0 0 1 0 16 12 12 0 0 1 0-16z"/><path d="M2 10h16"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 4v10a2 2 0 1 0 2 2V7l8-1.5v5.3a2 2 0 1 0 2 2V4z"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="16" height="12" rx="2"/><path d="M2 7h16M6 3v4M14 3v4"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M4 18c0-4 2.7-6 6-6s6 2 6 6"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 14l4-8 3 6 3-4 4 6"/><path d="M2 16h16"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="10" r="2"/><path d="M10 4v2M10 14v2M4 10h2M14 10h2M5.5 5.5l1.5 1.5M13 13l1.5 1.5M5.5 14.5l1.5-1.5M13 7l1.5-1.5"/></svg>',
];

let allWorkspaces = [];
let mediaByWs = {};

function iconForWs(w, idx) { return icons[idx % icons.length]; }

function render(ws, filter = '') {
  gl.innerHTML = '';
  const filtered = filter ? ws.filter(w => w.name.toLowerCase().includes(filter.toLowerCase())) : ws;
  if (!filtered.length) {
    gl.innerHTML = '<div class="he"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><div class="bt">' + (filter ? 'No workspaces match "' + esc(filter) + '"' : 'No workspaces yet') + '</div><div class="bs">' + (filter ? 'Try a different search' : 'Click "New Workspace" to get started') + '</div></div>';
    return;
  }
  filtered.forEach((w, idx) => {
    const el = document.createElement('div');
    el.className = 'wc';
    el.style.setProperty('--ws-color', w.color || '#4a8bc5');
    el.style.animationDelay = (idx * 0.04) + 's';
    const playing = mediaByWs[w.id];
    const playingBadge = playing
      ? `<span class="playing-badge"><svg viewBox="0 0 16 16" fill="currentColor" style="animation:pulse 1.5s ease-in-out infinite"><path d="M5 2v9.3A3 3 0 1 0 7 13V5.5l5-1v3.8A3 3 0 1 0 14 9V1z"/></svg>${esc(playing[0].title || 'Audio')}</span>`
      : '';
    const iconBg = (w.color || '#4a8bc5') + '22';
    el.innerHTML = `
      <div class="wc-top"></div>
      <div class="wc-body">
        <div class="wc-head">
          <div class="wc-icon" style="background:${iconBg};color:${w.color||'#4a8bc5'}">${iconForWs(w, idx)}</div>
          <div class="wc-meta">
            <div class="wc-name">${esc(w.name)}</div>
            <div class="wc-date">Created ${timeAgo(w.created)}</div>
          </div>
          <button class="wc-rename" data-id="${w.id}" title="Rename workspace">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L6 12.5l-3 .5.5-3z"/><path d="M9.5 4l2.5 2.5"/></svg>
          </button>
          <button class="wc-del" data-id="${w.id}" title="Delete workspace">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
        </div>
        <div class="wc-stats">
          <span class="wc-stat"><span class="dot"></span>${w.tabCount} tab${w.tabCount !== 1 ? 's' : ''}</span>
          ${playingBadge}
        </div>
        <div class="wc-open">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg>
          Open Workspace
        </div>
      </div>`;
    el.onclick = (e) => { if (e.target.closest('.wc-del, .wc-rename')) return; g.selectWorkspace(w.id); };
    el.querySelector('.wc-del').onclick = async (e) => {
      e.stopPropagation();
      await g.deleteWorkspace(w.id);
      await load();
    };
    el.querySelector('.wc-rename').onclick = (e) => {
      e.stopPropagation();
      openRename(w);
    };
    gl.appendChild(el);
  });
}

async function load() {
  const [u, ws, mediaState] = await Promise.all([g.getUser(), g.getWorkspaces(), g.getMediaState()]);
  document.getElementById('uname').textContent = u ? u.pseudo : '—';
  allWorkspaces = ws || [];
  mediaByWs = mediaState.byWorkspace || {};
  const q = document.getElementById('ws-search').value;
  render(allWorkspaces, q);
  const npEl = document.getElementById('np');
  if (mediaState.playing && mediaState.tabs.length > 0) {
    document.getElementById('np-title').textContent = mediaState.tabs[0].title || 'Playing audio';
    npEl.style.display = 'flex';
  } else {
    npEl.style.display = 'none';
  }
}

let searchDebounce = null;
document.getElementById('ws-search').addEventListener('input', e => {
  if (searchDebounce) clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => render(allWorkspaces, e.target.value), 100);
});

document.getElementById('nw').onclick = () => {
  document.getElementById('nm').classList.add('open');
  document.getElementById('wni').value = '';
  document.getElementById('wmerr').textContent = '';
  setTimeout(() => document.getElementById('wni').focus(), 50);
};
document.getElementById('wmc').onclick = () => document.getElementById('nm').classList.remove('open');
document.getElementById('wmok').onclick = async () => {
  const name = document.getElementById('wni').value.trim();
  if (!name) { document.getElementById('wmerr').textContent = 'Enter a workspace name.'; return; }
  if (name.length > 30) { document.getElementById('wmerr').textContent = 'Max 30 characters.'; return; }
  const r = await g.createWorkspace(name);
  if (r.ok) { document.getElementById('nm').classList.remove('open'); await load(); }
  else { document.getElementById('wmerr').textContent = r.error || 'Failed to create workspace.'; }
};
document.getElementById('wni').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('wmok').click();
  if (e.key === 'Escape') document.getElementById('wmc').click();
});

let renameId = null;
function openRename(w) {
  renameId = w.id;
  document.getElementById('rm').classList.add('open');
  document.getElementById('rni').value = w.name;
  document.getElementById('rmerr').textContent = '';
  setTimeout(() => { const i = document.getElementById('rni'); i.focus(); i.select(); }, 50);
}
document.getElementById('rmc').onclick = () => document.getElementById('rm').classList.remove('open');
document.getElementById('rmok').onclick = async () => {
  const name = document.getElementById('rni').value.trim();
  if (!name) { document.getElementById('rmerr').textContent = 'Enter a workspace name.'; return; }
  if (name.length > 30) { document.getElementById('rmerr').textContent = 'Max 30 characters.'; return; }
  const r = await g.renameWorkspace(renameId, name);
  if (r && r.ok) { document.getElementById('rm').classList.remove('open'); renameId = null; await load(); }
  else { document.getElementById('rmerr').textContent = (r && r.error) || 'Failed to rename workspace.'; }
};
document.getElementById('rni').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('rmok').click();
  if (e.key === 'Escape') document.getElementById('rmc').click();
});
document.getElementById('lgo').onclick = async () => { await g.logout(); window.location.href = 'login.html'; };
document.getElementById('np').onclick = () => { if (allWorkspaces[0]) g.selectWorkspace(allWorkspaces[0].id); };

g.clearMenu();
let mediaDebounce = null;
g.onMediaState((d) => {
  mediaByWs = d.byWorkspace || {};
  if (d.playing && d.tabs.length > 0) {
    document.getElementById('np-title').textContent = d.tabs[0].title || 'Playing audio';
    document.getElementById('np').style.display = 'flex';
  } else {
    document.getElementById('np').style.display = 'none';
  }
  if (mediaDebounce) clearTimeout(mediaDebounce);
  mediaDebounce = setTimeout(() => render(allWorkspaces, document.getElementById('ws-search').value), 200);
});

['mousemove','mousedown','keydown','click'].forEach(ev => document.addEventListener(ev, () => g.resetIdleTimer(), { passive: true }));
load();
</script>
</body>
</html>
