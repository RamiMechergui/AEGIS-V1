<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
  --bg: #08080e;
  --surface: #0e0e16;
  --surface2: #15151f;
  --surface3: #1c1c2a;
  --border: rgba(255,255,255,0.035);
  --border2: rgba(255,255,255,0.06);
  --text: #dfdfe8;
  --text2: #85859a;
  --text3: #55556a;
  --blue: #4a8bc5;
  --blue-hover: #5a9bd5;
  --blue-bg: rgba(74,139,197,0.07);
  --purple: #7a5db5;
  --green: #48bb78;
  --green-bg: rgba(72,187,120,0.07);
  --red: #e56a6a;
  --red-bg: rgba(229,106,106,0.07);
  --radius: 8px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:13.5px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}
.wrap{width:680px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}
.greet h2{font-size:22px;font-weight:300;color:var(--text);letter-spacing:-0.2px}
.greet p{font-size:11px;color:var(--text2);margin-top:2px}
.greet .nm{color:var(--blue);font-weight:500}
.action{display:flex;gap:6px}
#lgo{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 16px;border-radius:var(--radius);cursor:pointer;font-size:10.5px;transition:all .15s var(--ease-out);font-weight:450}
#lgo:hover{background:var(--red-bg);border-color:rgba(229,106,106,0.15);color:var(--red)}
#nw{background:var(--blue);border:none;color:#fff;padding:7px 18px;border-radius:var(--radius);cursor:pointer;font-size:10.5px;font-weight:500;transition:all .2s var(--ease-out);letter-spacing:0.2px}
#nw:hover{background:var(--blue-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(74,139,197,0.25)}
#nw:active{transform:translateY(0)}
#gl{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;padding:2px}
.wc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s var(--ease-out);position:relative;overflow:hidden}
.wc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--green),var(--blue));background-size:200% 100%;opacity:0;transition:opacity .35s}
.wc:hover::before{opacity:1;animation:shimmer 2s linear infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.wc:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(74,139,197,0.12),0 8px 32px rgba(0,0,0,0.35),0 0 60px rgba(74,139,197,0.06);border-color:rgba(74,139,197,0.06)}
.wc .wi{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wc .wiv{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue-bg),rgba(122,93,181,0.07));display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .4s var(--ease-out)}
.wc:hover .wiv{transform:scale(1.1) rotate(-3deg);background:rgba(74,139,197,0.12)}
.wc .wn{font-size:14px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc .wm{font-size:9.5px;color:var(--text3);margin-left:auto;white-space:nowrap;flex-shrink:0}
.wc .ws{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--text2)}
.wc .ws .dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
.wc .wdel{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;opacity:0;transition:all .15s var(--ease-out);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.wc:hover .wdel{opacity:0.5}
.wc .wdel:hover{opacity:1;color:var(--red);background:var(--red-bg)}
.act{display:flex;align-items:center;gap:5px;color:var(--blue);font-size:10.5px;margin-top:12px;font-weight:450;opacity:0;transition:all .25s var(--ease-out)}
.wc:hover .act{opacity:1;transform:translateX(0)}
.he{display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;color:var(--text3);gap:6px;grid-column:1/-1}
.he .bi{font-size:38px;opacity:0.15}
.he .bt{font-size:13px;color:var(--text2);margin-top:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.wc{animation:slideUp .35s var(--ease-out) both}
.wc:nth-child(1){animation-delay:0.02s}
.wc:nth-child(2){animation-delay:0.05s}
.wc:nth-child(3){animation-delay:0.08s}
.wc:nth-child(4){animation-delay:0.11s}
.wc:nth-child(5){animation-delay:0.14s}
.wc:nth-child(6){animation-delay:0.17s}
.wc:nth-child(7){animation-delay:0.20s}
.wc:nth-child(8){animation-delay:0.23s}
#np{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:6px;background:var(--green-bg);border:1px solid rgba(72,187,120,0.12);border-radius:var(--radius-pill,10px);padding:8px 18px;font-size:10.5px;color:var(--green);max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow);transition:all .2s var(--ease-out)}
#np{animation:fadeIn .2s var(--ease-out)}
#np:hover{background:rgba(72,187,120,0.1);border-color:rgba(72,187,120,0.2);transform:translateX(-50%) translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.4)}
#np .np-icon{flex-shrink:0;display:flex}
#np .np-icon svg{width:13px;height:13px;animation:pulse 1.5s ease-in-out infinite}
#np-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(6px);animation:fadeIn .15s var(--ease-out)}
.modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:28px;width:340px;box-shadow:0 8px 48px rgba(0,0,0,0.5);animation:slideUp .25s var(--ease-out)}
.mbox h3{font-size:14px;font-weight:500;margin-bottom:2px;color:var(--text)}
.mbox p{font-size:10.5px;color:var(--text2);margin-bottom:16px;line-height:1.4}
.mbox input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.mbox input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg);background:var(--surface2)}
.mbox .merr{font-size:10px;color:var(--red);margin-bottom:10px;min-height:14px}
.mb{display:flex;gap:8px}
.mb button{flex:1;padding:8px;border:none;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;font-weight:500;transition:all .15s var(--ease-out)}
.mb .mp{background:var(--blue);color:#fff}
.mb .mp:hover{background:var(--blue-hover);transform:translateY(-1px)}
.mb .ms{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.mb .ms:hover{background:var(--surface3);color:var(--text)}

/* ── Noise Overlay ── */
body::after{content:'';position:fixed;inset:0;z-index:99999;pointer-events:none;opacity:0.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:128px 128px;mix-blend-mode:overlay}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="greet">
      <h2>Welcome back, <span class="nm" id="uname">—</span></h2>
      <p>Choose a workspace to continue browsing</p>
    </div>
    <div class="action">
      <button id="lgo"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 3l4 4-4 4"/><path d="M14 7H6"/><path d="M6 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3"/></svg> Logout</button>
      <button id="nw"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg> New Workspace</button>
    </div>
  </div>
  <div id="gl"></div>
</div>

<div id="np" title="Background media playing">
  <span class="np-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 2v9.3A3 3 0 1 0 7 13V5.5l5-1v3.8A3 3 0 1 0 14 9V1z"/></svg></span>
  <span id="np-title"></span>
</div>

<div class="modal" id="nm">
  <div class="mbox">
    <h3>Create Workspace</h3>
    <p>Give your workspace a name to get started</p>
    <input type="text" id="wni" placeholder="e.g. Work, Studies, Video Editing" maxlength="30" autofocus>
    <div class="merr" id="wmerr"></div>
    <div class="mb">
      <button class="ms" id="wmc">Cancel</button>
      <button class="mp" id="wmok">Create</button>
    </div>
  </div>
</div>

<script>
const g = window.ghost;
const gl = document.getElementById('gl');
const uname = document.getElementById('uname');
const nw = document.getElementById('nw');
const lgo = document.getElementById('lgo');
const nm = document.getElementById('nm');
const wni = document.getElementById('wni');
const wmerr = document.getElementById('wmerr');
const wmc = document.getElementById('wmc');
const wmok = document.getElementById('wmok');

const icons = [
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="16" height="11" rx="2"/><path d="M7 15v1h6v-1M10 11v-3M8 8l2 2 2-2"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v16h12V2H4zM4 6h12M8 2v4"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="16" height="12" rx="2"/><circle cx="10" cy="9" r="3"/><path d="M10 6.5v5"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h8M10 6v8M3 7v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v10a2 2 0 1 0 2 2V7l8-1.5v5.3a2 2 0 1 0 2 2V4z"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><path d="M10 2a12 12 0 0 1 0 16 12 12 0 0 1 0-16z"/><path d="M2 10h16"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="9" r="3"/><circle cx="16" cy="7" r="1"/><rect x="2" y="5" width="16" height="10" rx="2"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l4-8 3 6 3-4 4 6"/><path d="M2 16h16"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v4M10 10v8M6 6h8M4 10h12"/><circle cx="10" cy="10" r="8"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V5l8 4-8 4"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16M14 2v16M2 6h16M2 14h16"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2"/><path d="M10 4v2M10 14v2M4 10h2M14 10h2M5.5 5.5l1.5 1.5M13 13l1.5 1.5M5.5 14.5l1.5-1.5M13 7l1.5-1.5"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l2-8h8l2 8"/><path d="M2 14h16v2H2z"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V5h7l3 3v9H4z"/><path d="M11 5v3h3"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M4 18c0-4 2.7-6 6-6s6 2 6 6"/></svg>',
  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="M2 10h16"/><path d="M10 2c2 2 3 5 3 8s-1 6-3 8c-2-2-3-5-3-8s1-6 3-8z"/></svg>',
];

function randIcon() { return icons[Math.floor(Math.random() * icons.length)]; }

let mediaByWs = {};

async function load() {
  const [u, ws, mediaState] = await Promise.all([
    g.getUser(),
    g.getWorkspaces(),
    g.getMediaState(),
  ]);
  uname.textContent = u ? u.pseudo : '—';
  mediaByWs = mediaState.byWorkspace || {};
  render(ws);
  if (mediaState.playing && mediaState.tabs.length > 0) {
    npTitle.textContent = mediaState.tabs.length > 1 ? mediaState.tabs.length + ' tabs playing \u00B7 ' + mediaState.tabs[0].title : mediaState.tabs[0].title || 'Playing audio';
    npEl.style.display = 'flex';
  } else {
    npEl.style.display = 'none';
  }
}

function render(ws) {
  gl.innerHTML = '';
  if (!ws || ws.length === 0) {
    gl.innerHTML = '<div class="he"><div class="bi"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div class="bt">No workspaces yet</div><div class="bs">Create one to start browsing</div></div>';
    return;
  }
  ws.forEach(w => {
    const el = document.createElement('div'); el.className = 'wc';
    const d = new Date(w.created);
    const dd = d.toLocaleDateString([], { month:'short', day:'numeric' });
    const ic = randIcon();
    const playing = mediaByWs[w.id];
    const playingBadge = playing ? '<span style="margin-left:8px;font-size:10px;color:#68d391;display:inline-flex;align-items:center;gap:3px"><span style="display:flex;animation:pulse 1.5s ease-in-out infinite"><svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M5 2v9.3A3 3 0 1 0 7 13V5.5l5-1v3.8A3 3 0 1 0 14 9V1z"/></svg></span>' + esc(playing[0].title || 'Audio') + '</span>' : '';
    el.innerHTML = '<button class="wdel" data-id="'+w.id+'"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div class="wi"><div class="wiv" style="color:'+(parseInt(w.id||0)%2===0?'var(--blue)':'var(--purple)')+'">'+ic+'</div><div class="wn">'+esc(w.name)+'</div><div class="wm">'+dd+'</div></div><div class="ws"><span><span class="dot"></span>'+w.tabCount+' tab'+(w.tabCount!==1?'s':'')+'</span>'+playingBadge+'</div><div class="act"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg> Open Workspace</div>';
    el.onclick = (e) => {
      if (e.target.closest('.wdel')) return;
      g.selectWorkspace(w.id);
    };
    gl.appendChild(el);
  });
  document.querySelectorAll('.wdel').forEach(b => {
    const id = b.dataset.id;
    b.onclick = async (e) => { e.stopPropagation(); await g.deleteWorkspace(id); load(); };
  });
}

function updateMediaBadges() {
  const cards = document.querySelectorAll('.wc');
  cards.forEach(card => {
    const delBtn = card.querySelector('.wdel');
    if (!delBtn) return;
    const id = delBtn.dataset.id;
    const wsRow = card.querySelector('.ws');
    if (!wsRow) return;
    const existing = wsRow.querySelector('.playing-badge');
    if (existing) existing.remove();
    const playing = mediaByWs[id];
    if (playing) {
      const badge = document.createElement('span');
      badge.className = 'playing-badge';
      badge.style.cssText = 'margin-left:8px;font-size:10px;color:#68d391;display:inline-flex;align-items:center;gap:3px';
      badge.innerHTML = '<span style="display:flex;animation:pulse 1.5s ease-in-out infinite"><svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M5 2v9.3A3 3 0 1 0 7 13V5.5l5-1v3.8A3 3 0 1 0 14 9V1z"/></svg></span>' + esc(playing[0].title || 'Audio');
      wsRow.appendChild(badge);
    }
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

nw.onclick = () => { nm.classList.add('open'); wni.value = ''; wmerr.textContent = ''; wni.focus(); };
wmc.onclick = () => { nm.classList.remove('open'); };
wmok.onclick = async () => {
  const name = wni.value.trim();
  if (!name) { wmerr.textContent = 'Enter a workspace name.'; return; }
  if (name.length > 30) { wmerr.textContent = 'Max 30 characters.'; return; }
  const r = await g.createWorkspace(name);
  if (r.ok) { nm.classList.remove('open'); load(); }
  else { wmerr.textContent = r.error; }
};
wni.addEventListener('keydown', (e) => { if (e.key === 'Enter') wmok.click(); if (e.key === 'Escape') wmc.click(); });
lgo.onclick = async () => { await g.logout(); window.location.href = 'login.html'; };

// ── Background Media Indicator ──
const npEl = document.getElementById('np');
const npTitle = document.getElementById('np-title');

g.clearMenu();

g.onMediaState((d) => {
  mediaByWs = d.byWorkspace || {};
  updateMediaBadges();
  if (d.playing && d.tabs.length > 0) {
    npTitle.textContent = d.tabs.length > 1 ? d.tabs.length + ' tabs playing \u00B7 ' + d.tabs[0].title : d.tabs[0].title || 'Playing audio';
    npEl.style.display = 'flex';
  } else {
    npEl.style.display = 'none';
  }
});

load();

npEl.onclick = () => {
  const t = document.querySelector('.wc');
  if (t) t.click();
};

['mousemove','mousedown','keydown','click','scroll','touchstart','wheel'].forEach(evt => {
  document.addEventListener(evt, () => g.resetIdleTimer(), { passive: true });
});
</script>
</body>
</html>
